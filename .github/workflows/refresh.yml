name: Refresh BLS employment data

on:
  schedule:
    # 9am UTC on the 25th of each month (BLS LAUS data is usually released
    # around the 3rd week of the month for the prior month). Adjust anytime.
    - cron: '0 9 25 * *'
  workflow_dispatch: {}   # lets you click "Run workflow" manually on GitHub

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest BLS data
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: python fetch_bls_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bls_data.json
          git diff --staged --quiet || git commit -m "Auto-refresh BLS employment data"
          git push

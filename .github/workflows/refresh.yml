name: Refresh BLS employment data

on:
  schedule:
    # Runs every day at 21:00 UTC (5pm Eastern / 4pm Central). BLS publishes
    # new city/county/metro numbers on irregular dates near the end of each
    # month (e.g. Aug 2026 data on Sep 30, Sep data on Oct 28), so a single
    # monthly run is always one release behind. Checking daily means the site
    # picks up new data within a day of release. Days with nothing new change
    # nothing -- fetch_bls_data.py leaves bls_data.json untouched.
    - cron: '0 21 * * *'
  workflow_dispatch: {}   # lets you click "Run workflow" manually on GitHub

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest BLS data
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: python fetch_bls_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bls_data.json
          git diff --staged --quiet || git commit -m "Auto-refresh BLS employment data"
          git push

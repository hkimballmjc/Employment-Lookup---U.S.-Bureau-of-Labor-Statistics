<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employment Lookup — LAUS (BLS)</title>
<style>
  :root {
    --cream: #F6F3EA;
    --forest: #2C4A3B;
    --forest-dark: #1E332A;
    --gold: #B8912E;
    --ink: #262420;
    --line: #DAD3C0;
    --white: #FFFDF8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    min-height: 100vh;
  }
  header {
    background: var(--forest);
    color: var(--cream);
    padding: 28px 32px 22px;
    border-bottom: 4px solid var(--gold);
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  header p {
    margin: 0;
    font-size: 0.85rem;
    color: #CFE0D6;
    font-family: "Courier New", monospace;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 24px 60px;
  }
  .search-block {
    margin-bottom: 18px;
  }
  .search-label {
    display: block;
    font-family: "Courier New", monospace;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--forest-dark);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .search-wrap {
    position: relative;
  }
  .search-input {
    width: 100%;
    font-size: 1.1rem;
    padding: 14px 16px;
    border: 2px solid var(--forest);
    border-radius: 4px;
    background: var(--white);
    font-family: "Courier New", monospace;
    color: var(--ink);
  }
  .search-input:focus {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
  }
  .suggestions {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 4px;
    box-shadow: 0 6px 16px rgba(30,51,42,0.12);
    max-height: 260px;
    overflow-y: auto;
    z-index: 10;
  }
  .suggestions button {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-bottom: 1px solid var(--line);
    padding: 10px 16px;
    font-family: "Courier New", monospace;
    font-size: 0.95rem;
    color: var(--ink);
    cursor: pointer;
  }
  .suggestions button:last-child { border-bottom: none; }
  .suggestions button:hover, .suggestions button:focus {
    background: var(--cream);
    color: var(--forest-dark);
  }
  #meta {
    margin-top: 28px;
    font-family: "Courier New", monospace;
    font-size: 0.85rem;
    color: #6B6455;
  }
  #result { margin-top: 18px; }
  #result h2 {
    font-size: 1.15rem;
    color: var(--forest-dark);
    border-bottom: 2px solid var(--gold);
    padding-bottom: 6px;
    margin-bottom: 4px;
  }
  .subtext {
    font-family: "Courier New", monospace;
    font-size: 0.8rem;
    color: #6B6455;
    margin-bottom: 14px;
  }
  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  select, button.action {
    font-family: "Courier New", monospace;
    font-size: 0.85rem;
    padding: 7px 12px;
    border: 1px solid var(--forest);
    border-radius: 4px;
    background: var(--white);
    color: var(--forest-dark);
    cursor: pointer;
  }
  button.action {
    background: var(--forest);
    color: var(--cream);
    border-color: var(--forest);
  }
  button.action:hover { background: var(--forest-dark); }
  #copied-msg {
    font-family: "Courier New", monospace;
    font-size: 0.8rem;
    color: var(--forest-dark);
    visibility: hidden;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--white);
    font-family: "Courier New", monospace;
    font-size: 0.9rem;
  }
  th, td {
    text-align: left;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
  }
  th {
    background: var(--forest);
    color: var(--cream);
    font-weight: 600;
    position: sticky;
    top: 0;
  }
  tr:nth-child(even) td { background: #FBF9F2; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .empty-state, .no-match {
    font-family: "Courier New", monospace;
    color: #6B6455;
    padding: 20px 0;
  }
  .no-match { color: #8A4A2A; }
</style>
</head>
<body>

<header>
  <h1>Employment Lookup</h1>
  <p id="header-sub">BLS Local Area Unemployment Statistics · not seasonally adjusted · loading…</p>
</header>

<main>
  <div class="search-block">
    <label class="search-label">Cities</label>
    <div class="search-wrap">
      <input id="search-city" class="search-input" type="text" placeholder="Type a city… e.g. Austin, League City, Memphis" autocomplete="off">
      <div id="suggestions-city" class="suggestions" style="display:none;"></div>
    </div>
  </div>

  <div class="search-block">
    <label class="search-label">Counties</label>
    <div class="search-wrap">
      <input id="search-county" class="search-input" type="text" placeholder="Type a county… e.g. Travis, Pulaski, Davidson" autocomplete="off">
      <div id="suggestions-county" class="suggestions" style="display:none;"></div>
    </div>
  </div>

  <div class="search-block">
    <label class="search-label">Metropolitan Areas (MSAs)</label>
    <div class="search-wrap">
      <input id="search-metro" class="search-input" type="text" placeholder="Type a metro area… e.g. Austin-Round Rock, Nashville" autocomplete="off">
      <div id="suggestions-metro" class="suggestions" style="display:none;"></div>
    </div>
  </div>

  <div id="result">
    <p class="empty-state">Start typing a place name above to pull its employment data.</p>
  </div>
</main>

<script>
let DATA = null;

const CATEGORIES = {
  city:   { dataKey: 'cities',   inputId: 'search-city',   suggId: 'suggestions-city' },
  county: { dataKey: 'counties', inputId: 'search-county', suggId: 'suggestions-county' },
  metro:  { dataKey: 'metros',   inputId: 'search-metro',  suggId: 'suggestions-metro' },
};

fetch('./bls_data.json')
  .then(r => r.json())
  .then(json => {
    DATA = json;
    const generated = new Date(json.generated_utc);
    const counts = `${Object.keys(json.cities).length} cities, `
      + `${Object.keys(json.counties).length} counties, `
      + `${Object.keys(json.metros).length} metros`;
    document.getElementById('header-sub').textContent =
      `${json.measure} · ${json.states.join('/')} · ${counts} · refreshed ${generated.toLocaleDateString()}`;
  })
  .catch(err => {
    document.getElementById('header-sub').textContent =
      'Could not load bls_data.json — run fetch_bls_data.py first.';
    console.error(err);
  });

const resultBox = document.getElementById('result');

Object.entries(CATEGORIES).forEach(([catKey, cfg]) => {
  const input = document.getElementById(cfg.inputId);
  const suggestionsBox = document.getElementById(cfg.suggId);

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if (!q || !DATA) { suggestionsBox.style.display = 'none'; return; }
    const labels = Object.keys(DATA[cfg.dataKey]);
    const matches = labels.filter(label => label.toLowerCase().includes(q)).slice(0, 8);
    if (matches.length === 0) {
      suggestionsBox.style.display = 'none';
      return;
    }
    suggestionsBox.innerHTML = '';
    matches.forEach(label => {
      const btn = document.createElement('button');
      btn.textContent = label;
      btn.addEventListener('click', () => {
        input.value = label;
        suggestionsBox.style.display = 'none';
        renderPlace(catKey, label);
      });
      suggestionsBox.appendChild(btn);
    });
    suggestionsBox.style.display = 'block';
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && DATA) {
      const q = input.value.trim().toLowerCase();
      const labels = Object.keys(DATA[cfg.dataKey]);
      const exact = labels.find(l => l.toLowerCase() === q);
      const firstMatch = exact || labels.find(l => l.toLowerCase().includes(q));
      if (firstMatch) {
        input.value = firstMatch;
        suggestionsBox.style.display = 'none';
        renderPlace(catKey, firstMatch);
      }
    }
  });
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrap')) {
    Object.values(CATEGORIES).forEach(cfg => {
      document.getElementById(cfg.suggId).style.display = 'none';
    });
  }
});

function pct(x) {
  if (x === null || x === undefined) return '—';
  return (x * 100).toFixed(2) + '%';
}
function num(x) {
  if (x === null || x === undefined) return '—';
  return x.toLocaleString();
}

function renderPlace(catKey, label) {
  const dataKey = CATEGORIES[catKey].dataKey;
  const place = DATA[dataKey][label];
  if (!place || !place.matched_area_text || !place.view || place.view.error) {
    const errMsg = place && place.view ? place.view.error : 'no data found';
    resultBox.innerHTML = `<p class="no-match">${label}: ${errMsg}.</p>`;
    return;
  }

  const header = `
    <h2>${label}</h2>
    <div class="subtext">BLS area: ${place.matched_area_text} &nbsp;·&nbsp; type: ${place.area_type}</div>
    <div class="toolbar">
      <button class="action" id="copy-btn">Copy table</button>
      <span id="copied-msg">Copied ✓</span>
    </div>
  `;

  if (place.area_type === 'city') {
    resultBox.innerHTML = header + renderCity(place.view);
  } else if (place.area_type === 'metro') {
    resultBox.innerHTML = header + renderMetro(place.view);
  } else if (place.area_type === 'county') {
    resultBox.innerHTML = header + renderCounty(place.view);
  } else {
    resultBox.innerHTML = header + '<p class="empty-state">Unknown area_type.</p>';
  }

  document.getElementById('copy-btn').addEventListener('click', () => copyPlace(place));
}

function renderCity(v) {
  const r = v.most_recent, p = v.three_years_prior;
  return `
    <table>
      <thead><tr><th></th><th>Employment</th></tr></thead>
      <tbody>
        <tr><td>Most Recent ${r.year} Monthly Data (${r.periodName})</td><td class="num">${num(r.value)}</td></tr>
        <tr><td>Corresponding ${p ? p.year : r.year - 3} Monthly Data (${p ? p.periodName : r.periodName})</td><td class="num">${p ? num(p.value) : '—'}</td></tr>
        <tr><td><em>3-Year Average Annual Growth Rate</em></td><td class="num">${pct(v.three_year_avg_annual_growth_rate)}</td></tr>
      </tbody>
    </table>
  `;
}

function renderMetro(v) {
  let rows = v.annual_6yr.map(r =>
    `<tr><td>${r.year}</td><td class="num">${num(r.jobs)}</td><td class="num">${num(r.growth)}</td><td class="num">${pct(r.growth_pct)}</td></tr>`
  ).join('');
  return `
    <table>
      <thead><tr><th>Year</th><th># of Jobs</th><th>Growth</th><th>Growth %</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot>
        <tr><td><strong>Total Growth</strong></td><td></td><td class="num"><strong>${num(v.total_growth)}</strong></td><td></td></tr>
        <tr><td><em>Average Annual Growth</em></td><td></td><td></td><td class="num"><em>${pct(v.avg_annual_growth)}</em></td></tr>
      </tfoot>
    </table>
  `;
}

function renderCounty(v) {
  let rows = v.annual_11yr.map(r =>
    `<tr><td>${r.year}</td><td class="num">${num(r.jobs)}</td><td class="num">${pct(r.growth_pct)}</td></tr>`
  ).join('');
  const ytdLabel = v.ytd ? `YTD ${v.ytd.year} (${v.ytd.periodName})` : 'YTD';
  return `
    <table>
      <thead><tr><th>Year</th><th>No. of Jobs</th><th>% Growth</th></tr></thead>
      <tbody>${rows}
        <tr><td><strong>${ytdLabel}</strong></td><td class="num"><strong>${v.ytd ? num(v.ytd.value) : '—'}</strong></td><td></td></tr>
      </tbody>
      <tfoot>
        <tr><td><em>10-yr Annual Avg</em></td><td></td><td class="num"><em>${pct(v.avg_annual_growth_10yr)}</em></td></tr>
        <tr><td><em>5-yr Annual Avg</em></td><td></td><td class="num"><em>${pct(v.avg_annual_growth_5yr)}</em></td></tr>
      </tfoot>
    </table>
  `;
}

function copyPlace(place) {
  const v = place.view;
  let tsv = '';
  if (place.area_type === 'city') {
    const r = v.most_recent, p = v.three_years_prior;
    tsv += `Most Recent ${r.year} Monthly Data (${r.periodName})\t${r.value}\n`;
    tsv += `Corresponding ${p ? p.year : r.year - 3} Monthly Data\t${p ? p.value : ''}\n`;
    tsv += `3-Year Average Annual Growth Rate\t${v.three_year_avg_annual_growth_rate !== null ? (v.three_year_avg_annual_growth_rate * 100).toFixed(2) + '%' : ''}\n`;
  } else if (place.area_type === 'metro') {
    tsv += 'Year\t# of Jobs\tGrowth\tGrowth %\n';
    v.annual_6yr.forEach(r => {
      tsv += `${r.year}\t${r.jobs}\t${r.growth ?? ''}\t${r.growth_pct !== null ? (r.growth_pct * 100).toFixed(2) + '%' : ''}\n`;
    });
    tsv += `Total Growth\t\t${v.total_growth ?? ''}\t\n`;
    tsv += `Average Annual Growth\t\t\t${v.avg_annual_growth !== null ? (v.avg_annual_growth * 100).toFixed(2) + '%' : ''}\n`;
  } else if (place.area_type === 'county') {
    tsv += 'Year\tNo. of Jobs\t% Growth\n';
    v.annual_11yr.forEach(r => {
      tsv += `${r.year}\t${r.jobs}\t${r.growth_pct !== null ? (r.growth_pct * 100).toFixed(2) + '%' : ''}\n`;
    });
    if (v.ytd) tsv += `YTD ${v.ytd.year}\t${v.ytd.value}\t\n`;
    tsv += `10-yr Annual Avg\t\t${v.avg_annual_growth_10yr !== null ? (v.avg_annual_growth_10yr * 100).toFixed(2) + '%' : ''}\n`;
    tsv += `5-yr Annual Avg\t\t${v.avg_annual_growth_5yr !== null ? (v.avg_annual_growth_5yr * 100).toFixed(2) + '%' : ''}\n`;
  }
  navigator.clipboard.writeText(tsv).then(() => {
    const msg = document.getElementById('copied-msg');
    msg.style.visibility = 'visible';
    setTimeout(() => { msg.style.visibility = 'hidden'; }, 1800);
  });
}
</script>

</body>
</html>
